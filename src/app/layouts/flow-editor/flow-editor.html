<div class="flex flex-col flex-1 h-full">

  <!-- HEADER -->
  <!--<app-header></app-header> -->

  <!-- BODY -->
  <div class="flex flex-row flex-1 overflow-hidden">

    <!-- LEFT SIDEBAR -->
    <app-editor-sidebar></app-editor-sidebar>

    <!-- CENTER EDITOR -->
    <main class="flex flex-col w-full bg-gray-100 overflow-hidden">
      @if (flow()) {
      <div class="flex-1 overflow-hidden">
        <app-title-toolbar></app-title-toolbar>
        <!-- editor canvas -->
        <div class="flex-1 h-full">
          <app-rete-editor [flowId]="flow()!.id" [flowData]="flow()!.data"></app-rete-editor>
        </div>
      </div>
      } @else {
      <div class="text-gray-400 text-center mt-10 flex flex-col flex-1">
        Select a document
      </div>
      }
    </main>

    <!-- RIGHT PANEL -->
    <!-- <app-right-panel></app-right-panel> -->

  </div>
</div>
