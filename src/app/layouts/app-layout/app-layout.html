<div class="main-layout flex h-screen flex-col">
  <mat-toolbar class="app-topbar !fixed !left-0 !right-0 !top-0 !z-50 !bg-[#d8f4e7] !text-slate-800">
    <div class="flex items-center gap-4">
      <img src="/logoNoName.png" alt="Logo" class="h-10" />
      <h1 class="m-0 text-lg font-medium">HumAIn Flow</h1>
    </div>

    <span class="flex-1"></span>

    <div class="flex items-center gap-3 text-sm font-medium text-gray-700">
      <button
        type="button"
        class="app-user-trigger"
        [matMenuTriggerFor]="userMenu">
        <mat-icon fontIcon="account_circle"></mat-icon>
        <span class="username">{{ loggedUser()?.username }}</span>
        <mat-icon fontIcon="arrow_drop_down"></mat-icon>
      </button>
      <button mat-stroked-button type="button" (click)="logout()">Logout</button>
    </div>
  </mat-toolbar>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item type="button" (click)="openChangePasswordDialog()">
      <mat-icon fontIcon="password"></mat-icon>
      <span>Change password</span>
    </button>
    @if (isAdmin()) {
    <button mat-menu-item type="button" routerLink="/admin/users">
      <mat-icon fontIcon="admin_panel_settings"></mat-icon>
      <span>Admin users</span>
    </button>
    }
  </mat-menu>

  @if (changePasswordSuccess()) {
  <div class="app-password-success-banner">
    <mat-icon fontIcon="check_circle"></mat-icon>
    <span>{{ changePasswordSuccess() }}</span>
  </div>
  }

  @if (changePasswordOpen() && loggedUser()?.username; as username) {
  <app-change-password-dialog
    [username]="username"
    [saving]="changePasswordSaving()"
    [submitError]="changePasswordError()"
    (closed)="closeChangePasswordDialog()"
    (submitted)="submitPasswordChange($event)">
  </app-change-password-dialog>
  }

  <div class="app-shell" [class.app-shell--admin]="isAdminRoute()">
    @if (!isAdminRoute()) {
    <div class="app-tabbar-wrap">
      <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="app-tabbar">
        <a
          mat-tab-link
          routerLink="/editor"
          routerLinkActive
          #editorRla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: true }"
          class="app-tab-link"
          [active]="editorRla.isActive">
          <mat-icon fontIcon="schema"></mat-icon>
          Editor
        </a>
        <a
          mat-tab-link
          routerLink="/tasks"
          routerLinkActive
          #tasksRla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: true }"
          class="app-tab-link"
          [active]="tasksRla.isActive">
          <mat-icon fontIcon="task_alt"></mat-icon>
          Tasks
        </a>
      </nav>
      <mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
    </div>
    }

    <main class="main-content app-main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
