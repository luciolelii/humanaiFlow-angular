<div class="main-layout min-h-screen flex flex-col">

  <!-- Header fisso -->
  <header class="app-header fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-4 h-16 bg-[#d8f4e7] border-b border-gray-300">
    <div class="left-section flex items-center gap-4">
      <img src="/logoNoName.png" alt="Logo" class="logo h-10" />
      <h1 class="app-title text-lg font-medium text-gray-800 m-0">HumAIn Flow</h1>
    </div>

    <div class="user-section flex items-center gap-2 text-gray-700 font-medium">
      <i class="bi bi-person-circle fs-4"></i>
      <span class="username">{{ loggedUser()?.username }}</span>
      <button class="btn btn-sm btn-light border-0 p-1" (click)="logout()" title="Logout" aria-label="Logout">
        <i class="bi bi-box-arrow-right text-secondary"></i>
      </button>
    </div>
  </header>

  <!-- Wrapper per compensare header fisso -->
  <div class="flex-1 pt-16 flex flex-col">

    <!-- Tabs sticky sotto header -->
    <ul class="nav nav-tabs sticky-top top-16 z-40 bg-[#d8f4e7]">
      <li class="nav-item">
        <a class="nav-link active" href="#">Active</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Link</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Link</a>
      </li>
    </ul>

    <!-- Contenuto principale scrollabile -->
    <main class="main-content flex-1 overflow-auto p-4 bg-gray-50">
      <p>Qui va il contenuto principale...</p>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>
      <p>Puoi aggiungere tutto ciò che vuoi, scrollando rimane visibile header + tabs.</p>
    </main>

  </div>
</div>
