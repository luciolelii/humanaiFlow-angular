<div class="cursor-move user-select-none rounded-xl bg-emerald-100 shadow-lg border border-gray-200 overflow-visible">
  <!-- header/row relativa -->
  <div class="relative w-full p-3 pt-0 flex items-center justify-between">
    <div class="grid grid-cols-4 h-full">
      <div class="col-span-4 text-ls mb-2 p-1 rounded-md text-green-700 font-bold">
       {{ data.label }}
      </div>
      <div class="col-span-3 align-middle h-full flex justify-center flex-col">
        <span class="inline-flex items-center rounded-md bg-green-50 px-2 py-1 text-xs font-medium text-green-700 inset-ring inset-ring-green-600/20">Text</span>
      </div>
      <div class="align-middle h-full flex flex-col justify-center items-end">
        <div refComponent class="absolute right-1" [data]="{
        type: 'socket',
        side: 'output',
        key: outputKey,
        nodeId: data.id,
        payload: outputSocket
      }" [emit]="emit"></div>
      </div>
    </div>
  </div>
</div>
