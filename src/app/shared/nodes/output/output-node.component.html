<div class="relative rounded-xl bg-white shadow-md border border-gray-200 overflow-visible">
  <!-- header/row relativa -->
  <div class="relative p-3 flex items-center justify-between overflow-visible">
    <div refComponent [data]="{
          type: 'socket',
          side: 'input',
          key: inputKey,
          nodeId: data.id,
          payload: inputSocket
        }" [emit]="emit"></div>
    <p class="text-sm font-semibold text-gray-700">{{ data.label }}</p>

    
  </div>
</div>
