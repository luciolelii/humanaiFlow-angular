<div class="flex items-center justify-between
            px-4 py-2
            bg-white border-b border-gray-200
            shadow-sm">

  <!-- Title -->
  <div class="flex items-center gap-2">
    <i class="bi bi-pencil-square text-indigo-500"></i>
    <h2 class="m-0 text-sm font-semibold text-gray-800">
        <input type="text" class="border-0 text-sm font-semibold text-gray-800
       focus:ring-0 p-0 m-0 box-border
       w-52 max-w-52
       bg-transparent"
               [value]="title()"
               (blur)="changeTitle(titleInput.value)"
                (keydown.enter)="changeTitle(titleInput.value); $event.target.blur()"
               maxlength="20"
               size="20"
               #titleInput
                />
    </h2>
    @if (notSaved()) {
    <span class="inline-flex items-center gap-x-1.5 py-1.5 px-3 rounded-full text-xs font-medium border border-yellow-500 text-yellow-500">not saved</span>
    }
  </div>


  <!-- Actions -->
  <div class="flex items-center gap-2" >
    <button tabindex="-1"
      class="border-0
             flex items-center gap-1
             enabled:hover:bg-green-200 enabled:text-green-600 disabled:text-green-300
             p-1"
      title="Save" [disabled]="!notSaved()" (click)="save()">
      <i class="bi bi-save"></i>
    </button>

     <div class="w-px h-5 bg-gray-200 mx-2"></div>

    <button tabindex="-1"
      class="border-0
             flex items-center gap-1
             enabled:hover:bg-gray-100 enabled:text-gray-600 disabled:text-gray-300 p-1"
      title="Undo" [disabled]="!editorState.undoEnabled()" (click)="undo()">
      <i class="bi bi-arrow-counterclockwise"></i>
    </button>

    <button tabindex="-1"
      class="border-0
             flex items-center gap-1
             enabled:hover:bg-gray-100 enabled:text-gray-600 disabled:text-gray-300 p-1"
             [disabled]="!editorState.redoEnabled()"
      title="Redo" (click)="redo()">
      <i class="bi bi-arrow-clockwise"></i>
    </button>

  </div>
</div>
