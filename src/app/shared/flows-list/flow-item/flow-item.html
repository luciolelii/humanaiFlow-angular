<mat-card class="flow-item-card"
    [class.flow-item-card-clickable]="!isRootOpen()"
    [class.flow-item-card-open]="flow().id === openedFlowId()"
    (click)="!isRootOpen() && open()">

    <div class="flow-item-head">
        <div class="flow-item-meta">
            <div class="flow-item-title">{{ flow().name }}</div>
            <div class="flow-item-author">{{ flow().author }}</div>
        </div>
    </div>

    <div class="flow-item-footer">
        <span>{{ flow().createdAt | date:'dd/MM/yyyy' }}</span>
        <div class="flow-item-actions">
            <button
                mat-icon-button
                [matTooltip]="flow().visibility === 'PRIVATE' ? 'Private flow' : 'Public flow'"
                class="flow-item-visibility-icon"
                (click)="$event.stopPropagation()"
                disabled>
                <mat-icon [fontIcon]="flow().visibility === 'PRIVATE' ? 'lock' : 'public'"></mat-icon>
            </button>
            <button mat-icon-button matTooltip="Clone flow"
                (click)="$event.stopPropagation(); clone()">
                <mat-icon fontIcon="content_copy"></mat-icon>
            </button>
            @if (projectsEnabled) {
            <button
                mat-icon-button
                [matTooltip]="assignTooltip()"
                [disabled]="!canAssignProject()"
                [matMenuTriggerFor]="projectMenu"
                (click)="$event.stopPropagation()">
                <mat-icon fontIcon="drive_file_move"></mat-icon>
            </button>
            <mat-menu #projectMenu="matMenu">
                @for (project of assignableProjects(); track project.id) {
                <button
                    mat-menu-item
                    type="button"
                    [disabled]="project.id === flow().projectId"
                    (click)="assignToProject(project)">
                    @if (project.id === flow().projectId) {
                    <mat-icon fontIcon="check"></mat-icon>
                    }
                    <span>{{ project.name }}</span>
                </button>
                }
                @if (assignableProjects().length === 0) {
                <button mat-menu-item type="button" disabled>
                    <span>No projects yet</span>
                </button>
                }
                <button
                    mat-menu-item
                    type="button"
                    [disabled]="!flow().projectId"
                    (click)="assignToProject(null)">
                    <mat-icon fontIcon="remove"></mat-icon>
                    <span>No project</span>
                </button>
            </mat-menu>
            }
            <button
                mat-icon-button
                [matTooltip]="deleteTooltip()"
                (click)="$event.stopPropagation(); remove()"
                [disabled]="!canDelete()">
                <mat-icon fontIcon="delete"></mat-icon>
            </button>
        </div>
    </div>

</mat-card>
