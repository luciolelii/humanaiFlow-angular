<div
    class="editor-sidebar-shell transition-all duration-300 ease-in-out overflow-hidden"
    data-tour="editor-sidebar-shell"
    [class.w-14]="collapsed()"
    [class.w-80]="!collapsed()"
  >
<aside class="h-full w-full min-w-0 bg-white border-r border-gray-200 flex overflow-hidden">
  <div class="flex flex-col h-full min-h-0 shrink-0">

    <button (click)="collapse()" class="relative
             w-6 h-6 rounded-full
             bg-white border shadow
             flex items-center justify-center
             hover:bg-gray-50 z-10" [class.invisible]="open == null">

      <i class="bi bi-chevron-left text-xs transition-transform"></i>
    </button>

    <!-- ICON MODE -->
    <div class="flex flex-col gap-4 items-center pt-6 flex-1">
      <i
        [ngClass]="{
          'cursor-pointer text-indigo-500 enabled': !flowsDisabled() && open != 'flows',
          'cursor-none bg-gray-200 text-indigo-500': !flowsDisabled() && open == 'flows',
          'text-gray-200': flowsDisabled()
        }"
        [attr.title]="flowsDisabled() ? 'Exit fullscreen to browse other flows' : 'Flows'"
        class="bi bi-lightning-charge-fill text-xl p-2"
        (click)="!flowsDisabled() && open != 'flows' && openSide('flows')"></i>
      <i
        [ngClass]="{
          'cursor-pointer text-gray-600 enabled': !blockDisabled() && open != 'blocks',
          'cursor-none bg-gray-200 text-sky-700': open == 'blocks',
          'text-gray-200': blockDisabled()
        }"
        class="bi bi-boxes text-xl p-2"
        (click)="!blockDisabled() && open != 'blocks' && openSide('blocks')"></i>
      <i
        [ngClass]="{
          'cursor-pointer text-gray-600 enabled': !containerDisabled() && open != 'containers',
          'cursor-none bg-gray-200 text-cyan-700': open == 'containers',
          'text-gray-200': containerDisabled()
        }"
        [attr.title]="flowState.isEditingSubflow() ? 'Containers are not supported inside subflows' : 'Containers'"
        class="bi bi-box-seam text-xl p-2"
        (click)="!containerDisabled() && open != 'containers' && openSide('containers')"></i>
    </div>
  </div>

  @if (!collapsed()) {
  <!-- CONTENT -->
  <div class="h-full min-h-0 min-w-0 bg-white flex-1 overflow-hidden">

    <div class="editor-sidebar-content h-full min-h-0 min-w-0 overflow-hidden">
      <div class="editor-sidebar-section">
      @switch (open) {
      @case ('flows') {
      <div data-tour="editor-sidebar-flows" class="h-full min-h-0 flex flex-col">
      <app-group-holder title="Flows" icon="bi-lightning-charge-fill">
        <span header-button class="editor-sidebar-new-flow-header-action">
        @if (!creatingFlow()) {
        <button
          type="button"
          class="editor-sidebar-new-flow-button"
          [matMenuTriggerFor]="newFlowMenu"
          aria-label="Create new flow">
          New
        </button>
        <mat-menu #newFlowMenu="matMenu" panelClass="editor-sidebar-new-flow-menu">
          <button type="button" mat-menu-item class="editor-sidebar-new-flow-menu-item" (click)="createNewFlow()">
            <mat-icon fontIcon="note_add"></mat-icon>
            <span>Empty flow</span>
          </button>
          <button type="button" mat-menu-item class="editor-sidebar-new-flow-menu-item" (click)="createNewFlowWithAi()">
            <mat-icon fontIcon="auto_awesome"></mat-icon>
            <span>Create with AI</span>
          </button>
          @if (projectsEnabled) {
          <button type="button" mat-menu-item class="editor-sidebar-new-flow-menu-item" (click)="createProject()">
            <mat-icon fontIcon="create_new_folder"></mat-icon>
            <span>New project</span>
          </button>
          }
        </mat-menu>
        } @else {
        <button
          type="button"
          class="editor-sidebar-new-flow-button editor-sidebar-new-flow-button-loading"
          disabled>
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span>New</span>
        </button>
        }
        </span>
        <app-flows-list #flowsList></app-flows-list>
      </app-group-holder>
      </div>
      }
      @case ('blocks') {
      <div data-tour="editor-sidebar-blocks" class="h-full min-h-0 flex flex-col">
      <app-group-holder title="Blocks" icon="bi-boxes">
        <app-blocks-list></app-blocks-list>
      </app-group-holder>
      </div>
      }
      @case ('containers') {
      <div data-tour="editor-sidebar-containers" class="h-full min-h-0 flex flex-col">
      <app-group-holder title="Containers" icon="bi-box-seam">
        <app-containers-list></app-containers-list>
      </app-group-holder>
      </div>
      }
      }
      </div>
    </div>

  </div>
  }
</aside>
</div>
