<div
    class="editor-sidebar-shell transition-all duration-300 ease-in-out overflow-hidden"
    [class.w-14]="collapsed()"
    [class.w-80]="!collapsed()"
  >
<aside class="h-full w-full min-w-0 bg-white border-r border-gray-200 flex overflow-hidden">
  <div class="flex flex-col h-full min-h-0 shrink-0">

    <button (click)="collapse()" class="relative
             w-6 h-6 rounded-full
             bg-white border shadow
             flex items-center justify-center
             hover:bg-gray-50 z-10" [class.invisible]="open == null">

      <i class="bi bi-chevron-left text-xs transition-transform"></i>
    </button>

    <!-- ICON MODE -->
    <div class="flex flex-col gap-4 items-center pt-6 flex-1">
      <i [ngClass]="{'cursor-none bg-gray-200' : open == 'flows'}"
         [ngClass]="{'cursor-pointer enabled' : open != 'flows'}"
         class="bi bi-lightning-charge-fill text-indigo-500 text-xl p-2" 
        (click)="open != 'flows' && openSide('flows')"></i>
      <i
        [ngClass]="{
          'cursor-pointer text-gray-600 enabled': !blockDisabled() && open != 'blocks',
          'cursor-none bg-gray-200 text-sky-700': open == 'blocks',
          'text-gray-200': blockDisabled()
        }"
        class="bi bi-boxes text-xl p-2"
        (click)="!blockDisabled() && open != 'blocks' && openSide('blocks')"></i>
      <i
        [ngClass]="{
          'cursor-pointer text-gray-600 enabled': !blockDisabled() && open != 'containers',
          'cursor-none bg-gray-200 text-cyan-700': open == 'containers',
          'text-gray-200': blockDisabled()
        }"
        class="bi bi-box-seam text-xl p-2"
        (click)="!blockDisabled() && open != 'containers' && openSide('containers')"></i>
    </div>
  </div>

  @if (!collapsed()) {
  <!-- CONTENT -->
  <div class="h-full min-h-0 min-w-0 bg-white flex-1 overflow-hidden">

    <div class="editor-sidebar-content h-full min-h-0 min-w-0 overflow-hidden">
      @switch (open) {
      @case ('flows') {
      <app-group-holder title="Flows" icon="bi-lightning-charge-fill">
        @if (!creatingFlow()) {
        <i ngProjectAs="header-button" 
          class="bi bi-plus-circle-fill text-blue-600 hover:cursor-pointer hover:text-blue-400 text-lg"
          (click)="createNewFlow()"></i>
        } @else {
        <span ngProjectAs="header-button" class="spinner-border spinner-border-sm text-blue-600" role="status">
          <span class="visually-hidden">Creating flow...</span>
        </span>
        }
        <app-flows-list></app-flows-list>
      </app-group-holder>
      }
      @case ('blocks') {
      <app-group-holder title="Blocks" icon="bi-boxes">
        <app-blocks-list></app-blocks-list>
      </app-group-holder>
      }
      @case ('containers') {
      <app-group-holder title="Containers" icon="bi-box-seam">
        <app-containers-list></app-containers-list>
      </app-group-holder>
      }
      }
    </div>

  </div>
  }
</aside>
</div>
